name: Limpiar infraestructura AWS (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe DESTROY para confirmar la eliminacion de ECS, ECR, ALB y VPC'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: reto-java-ecs-infra
  cancel-in-progress: false

jobs:
  destroy:
    if: github.event.inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
      - name: Inicializar Terraform
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"
      - name: Destruir recursos de la practica
        working-directory: infra
        run: terraform destroy -auto-approve -input=false -var="aws_region=${AWS_REGION}"
